openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: workspace
    description: Workspace chat and agent execution state
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /workspace-state:
    get:
      operationId: getWorkspaceState
      tags: [workspace]
      summary: Load workspace messages and the latest agent checkpoint
      responses:
        "200":
          description: Current workspace state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceState"
  /chat-messages:
    post:
      operationId: createChatMessage
      tags: [workspace]
      summary: Save a message to a channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "201":
          description: Saved message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "400":
          description: Invalid message
  /agent-run/checkpoints:
    post:
      operationId: createAgentRunCheckpoint
      tags: [workspace]
      summary: Save an agent execution checkpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRunCheckpointInput"
      responses:
        "201":
          description: Saved agent checkpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunState"
        "400":
          description: Invalid checkpoint
  /agent-run/analyze:
    post:
      operationId: analyzeAgentRun
      tags: [workspace]
      summary: Ask Ziki to analyze a task and create a human-reviewed plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeAgentRunInput"
      responses:
        "201":
          description: Saved Ziki response and pending plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZikiAnalysisResult"
        "400":
          description: Invalid task
        "429":
          description: Agent request limit reached
        "502":
          description: The model could not produce a valid plan
        "503":
          description: The server-side model key is not configured
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ChannelName:
      type: string
      enum: [general-dev, announcements, backend-go, frontend-react]
    ChatMessage:
      type: object
      properties:
        id:
          type: string
        channel:
          $ref: "#/components/schemas/ChannelName"
        author:
          type: string
        initials:
          type: string
        body:
          type: string
        avatar:
          type: ["string", "null"]
        kind:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required: [id, channel, author, initials, body, avatar, kind, createdAt]
    ChatMessageInput:
      type: object
      properties:
        channel:
          $ref: "#/components/schemas/ChannelName"
        body:
          type: string
          minLength: 1
          maxLength: 5000
      required: [channel, body]
    AgentRunStep:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [complete, paused, pending]
        duration:
          type: string
      required: [title, description, status, duration]
    AgentRunCheckpointInput:
      type: object
      properties:
        steps:
          type: array
          items:
            $ref: "#/components/schemas/AgentRunStep"
        override:
          type: string
        approval:
          type: string
          enum: [pending, approved, changes]
      required: [steps, override, approval]
    AgentRunState:
      allOf:
        - $ref: "#/components/schemas/AgentRunCheckpointInput"
        - type: object
          properties:
            updatedAt:
              type: string
              format: date-time
          required: [updatedAt]
    AnalyzeAgentRunInput:
      type: object
      properties:
        channel:
          $ref: "#/components/schemas/ChannelName"
        task:
          type: string
          minLength: 1
          maxLength: 1200
        mode:
          type: string
          enum: [analyze, continue, revise]
      required: [channel, task, mode]
    ZikiAnalysisResult:
      type: object
      properties:
        message:
          $ref: "#/components/schemas/ChatMessage"
        agentRun:
          $ref: "#/components/schemas/AgentRunState"
      required: [message, agentRun]
    WorkspaceState:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        agentRun:
          $ref: "#/components/schemas/AgentRunState"
      required: [messages, agentRun]

